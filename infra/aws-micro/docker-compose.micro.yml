# Lean single-box compose for the cheapest AWS path (one t3.micro / Lightsail box).
#
# Differences from docker-compose.prod.yml, all driven by fitting inside ~1 GB RAM:
#   - The frontend container is REMOVED. On this tier the SPA is served as static
#     files from S3 + CloudFront (see frontend-deploy.sh), so it costs no RAM here.
#   - Postgres and Redis are memory-capped hard so they cannot balloon and OOM the box.
#   - Invoice files default to LOCAL disk (EBS volume) instead of S3 to avoid needing
#     AWS credentials on the box; flip OBJECT_STORAGE_BACKEND=s3 in .env to use S3.
#   - The backend runs migrations on start (RUN_MIGRATIONS_ON_START=true) so a fresh
#     box self-initialises its schema without a separate migration step.
#
# All secrets/config come from the .env file next to this file (see .env.micro.example).

services:
  backend:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}
    restart: unless-stopped
    # Hard memory ceiling so the API can never starve Postgres on a 1 GB box.
    mem_limit: 420m
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: "false"
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_EXTRACTION_MODEL: ${OPENAI_EXTRACTION_MODEL:-gpt-4.1}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_EXTRACTION_MODEL: ${GEMINI_EXTRACTION_MODEL:-gemini-flash-latest}
      # Keep the box cheap: bias toward auto-approval + reuse so fewer/cheaper LLM calls.
      AUTO_APPROVAL_ENABLED: ${AUTO_APPROVAL_ENABLED:-true}
      EMBEDDING_REUSE_ENABLED: ${EMBEDDING_REUSE_ENABLED:-true}
      EXTRACTION_TIERING_ENABLED: ${EXTRACTION_TIERING_ENABLED:-true}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-invoice-platform}
      OBJECT_STORAGE_BACKEND: ${OBJECT_STORAGE_BACKEND:-local}
      OBJECT_STORAGE_LOCAL_PATH: /app/.local-storage
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-us-east-1}
      OBJECT_STORAGE_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY_ID:-}
      OBJECT_STORAGE_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_SECRET_ACCESS_KEY:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      # Single-box convenience: apply DB migrations automatically on boot.
      RUN_MIGRATIONS_ON_START: "true"
    # Bind to loopback only: the public entrypoint is Caddy (HTTPS over `edge`).
    # This port is reachable just on the box itself — e.g. via an SSH tunnel for
    # debugging (`ssh -L 8000:localhost:8000 <box>`), never from the internet.
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    volumes:
      - invoice_storage:/app/.local-storage
    entrypoint: ["sh", "/app/infra/docker/backend-entrypoint.sh"]
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--app-dir", "/app/backend"]
    # `default` keeps backend reachable by worker/postgres/redis; `edge` (with the
    # `invoices-backend` alias) lets the shared Caddy proxy route HTTPS to it.
    # `edge` is optional: it only needs to exist if you run docker-compose.caddy.yml.
    networks:
      default: {}
      edge:
        aliases:
          - invoices-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}
    restart: unless-stopped
    mem_limit: 320m
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: "false"
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_EXTRACTION_MODEL: ${OPENAI_EXTRACTION_MODEL:-gpt-4.1}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_EXTRACTION_MODEL: ${GEMINI_EXTRACTION_MODEL:-gemini-flash-latest}
      AUTO_APPROVAL_ENABLED: ${AUTO_APPROVAL_ENABLED:-true}
      EMBEDDING_REUSE_ENABLED: ${EMBEDDING_REUSE_ENABLED:-true}
      EXTRACTION_TIERING_ENABLED: ${EXTRACTION_TIERING_ENABLED:-true}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-invoice-platform}
      OBJECT_STORAGE_BACKEND: ${OBJECT_STORAGE_BACKEND:-local}
      OBJECT_STORAGE_LOCAL_PATH: /app/.local-storage
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-us-east-1}
      OBJECT_STORAGE_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY_ID:-}
      OBJECT_STORAGE_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_SECRET_ACCESS_KEY:-}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      # The worker must never run migrations; the backend owns that.
      RUN_MIGRATIONS_ON_START: "false"
      PROCESSING_QUEUE_NAME: ${PROCESSING_QUEUE_NAME:-invoice_processing_jobs}
      WORKER_POLL_TIMEOUT_SECONDS: ${WORKER_POLL_TIMEOUT_SECONDS:-5}
      WORKER_SLEEP_SECONDS: ${WORKER_SLEEP_SECONDS:-1}
      PROCESSING_JOB_MAX_ATTEMPTS: ${PROCESSING_JOB_MAX_ATTEMPTS:-3}
    volumes:
      - invoice_storage:/app/.local-storage
    depends_on:
      backend:
        condition: service_healthy
    command: ["python", "-m", "app.worker"]

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    mem_limit: 300m
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-invoice_platform}
      POSTGRES_USER: ${POSTGRES_USER:-invoice_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    # Tuned for a tiny box: small shared buffers + capped connections keep Postgres
    # inside its 300 MB ceiling. Raise these if you move to a 2 GB+ instance.
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=96MB"
      - "-c"
      - "effective_cache_size=256MB"
      - "-c"
      - "max_connections=40"
      - "-c"
      - "work_mem=4MB"
      - "-c"
      - "maintenance_work_mem=32MB"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-invoice_user} -d ${POSTGRES_DB:-invoice_platform}"]
      interval: 15s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    restart: unless-stopped
    mem_limit: 128m
    # noeviction (not LRU) because Redis is the JOB QUEUE here — evicting keys would
    # silently drop queued invoices. appendonly keeps the queue durable across reboots.
    command:
      - "redis-server"
      - "--appendonly"
      - "yes"
      - "--maxmemory"
      - "96mb"
      - "--maxmemory-policy"
      - "noeviction"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5

networks:
  # Created automatically per project; here so backend can also join `edge`.
  default: {}
  # Shared cross-project proxy network. Create once: `docker network create edge`.
  # external:true means compose won't try to create/destroy it.
  edge:
    external: true

volumes:
  postgres_data:
  redis_data:
  invoice_storage:
